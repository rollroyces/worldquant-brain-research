# Pre-commit hooks for worldquant-brain-research.
#
# Hook order matters: format first (ruff-format), then lint (ruff --fix),
# then type check (mypy), then hygiene hooks.
#
# Reinstall after editing this file:
#   pre-commit install
# Run on demand (without committing):
#   pre-commit run --all-files
#
# Install once per clone:
#   pip install pre-commit
#   pre-commit install

repos:
  # ----- ruff: lint + formatter (replaces flake8, isort, black) -----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint)
        # Apply safe auto-fixes so simple issues don't gate commits.
        args: [--fix]
        files: ^(brainlib|scripts|tests)/

      - id: ruff-format
        name: ruff-format
        files: ^(brainlib|scripts|tests)/

  # ----- mypy: static type check, scope to library + scripts -----
  # Tests/ is intentionally excluded here (see mypy.ini — they have looser
  # settings and CI's mypy job still covers them separately).
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy (brainlib + scripts)
        files: ^(brainlib|scripts)/
        args: [--config-file=mypy.ini]
        # mypy 1.13+ supports the Python 3.12 'type' statement syntax
        # used by recent numpy stubs. Pinning to 1.10.0 caused the hook
        # to fail on the numpy stub parse.
        # Include the project deps so mypy can resolve their type stubs.
        additional_dependencies:
          - "mypy==1.13.0"
          - "numpy<2.1"
          - "pandas"
          - "pandas-stubs"
          - "requests"

  # ----- standard pre-commit hygiene hooks -----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  # Note: no pytest smoke hook here. The full pytest matrix (3.10/3.11/3.12)
  # is already a separate CI job; running it again via pre-commit would
  # duplicate work and the hook's system-Python invocation can't see
  # project-installed pytest. If you want a pre-push safety net, run
  # `python -m pytest tests/test_gates.py` manually before pushing.
