[mypy]
# Strict-ish: catch real type bugs without demanding strict-optional everywhere.
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True

# Make the scripts/ directory importable so tests/ can `import brain_harness`
# etc. without a manual sys.path shim. mypy respects this for type resolution.
mypy_path = scripts

# Per-module overrides
[mypy-brainlib.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_unused_ignores = True

[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False

# Library stubs we don't (yet) have installed
[mypy-pandas]
ignore_missing_imports = True

[mypy-pandas-stubs]
ignore_missing_imports = True
